<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Тираланский Гримуар</title>
<meta name="theme-color" content="#0d0f0a">
<meta name="description" content="Гримуар вольных Тираланцев: кости судьбы и листы персонажей">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230d0f0a'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23c9a227' stroke-width='3'/%3E%3Cpath d='M50 26 L58 46 L80 50 L58 54 L50 74 L42 54 L20 50 L42 46 Z' fill='%23e6c35c'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гримуар">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <header class="app-header">
    <h1 class="app-title">Тираланский гримуар
      <small>кости судьбы · листы персонажей</small>
    </h1>
    <button id="openDrawer" class="seal-btn" aria-label="Открыть персонажей">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="8" r="3.4"/>
        <path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <!-- Экран костей -->
  <main id="screen-dice" class="screen active">
    <div class="dice-stage">

      <div id="resultScroll" class="result-scroll">
        <div class="result-placeholder">Бросьте кости, чтобы узнать волю судьбы</div>
      </div>

      <div id="dieRow" class="die-row"></div>

      <div class="count-row">
        <div class="count-label">
          <span>Количество костей</span>
          <b id="countValue">1</b>
        </div>
        <input id="countSlider" type="range" min="1" max="10" value="1" step="1">
      </div>

      <button id="rollBtn" class="roll-btn">Бросить кости</button>
    </div>
  </main>

  <!-- Экран листа персонажа -->
  <main id="screen-sheet" class="screen">
    <button id="sheetBack" class="sheet-back">&larr; Назад</button>
    <div id="sheetBody"></div>
  </main>

</div>

<!-- Ящик со списком персонажей -->
<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-header">
    <h2>Персонажи</h2>
    <button id="closeDrawer" class="close-btn" aria-label="Закрыть">✕</button>
  </div>
  <div id="charList" class="char-list"></div>
</aside>

<!-- Уведомление об обновлении -->
<div id="updateToast" class="update-toast">
  <span>Доступно обновление гримуара</span>
  <button id="updateReload">Обновить</button>
</div>

<script src="characters.js"></script>
<script src="app.js"></script>
</body>
</html>
